<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SQL and Graph Interface</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="../static/script.js" defer></script>
    
    <!-- Bonus : Jolie police Fira Code -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
    <!-- Lien vers le fichier CSS externe -->
    <link rel="stylesheet" href="../static/style.css">

</head>
<body>
    <div class="container">
        <h2>1️⃣ Insert your SQL query</h2>
        <!-- 📋 Description editable -->
        <div id="description" contenteditable="true" data-placeholder="What is your query?" spellcheck="false"></div>
        <div id="sqlTerminal" contenteditable="true" spellcheck="false"></div><br>
        <button onclick="sendQuery()">Send the query</button>
        <button onclick="toggleResult()">Show / Hide the results</button>

        <div id="queryResult" style="margin-top: 20px; display: none;">
            <h3>Query results :</h3>
            <pre id="resultArea"></pre>
        </div>

        <h2>2️⃣ Insert your Plotly code</h2>
        <div class="textarea-container">
            <textarea id="plotlyCode" placeholder="Insert the plotly code here" spellcheck="false"></textarea>
            <textarea id="plotlyLayout" placeholder="Insert the layout code here" spellcheck="false"></textarea>
        </div>
        
        <button onclick="drawPlot()">Draw the graph</button>

        <div id="graph"></div>

        <h2>🧩 Properties of the selected point</h2>
        <div id="pointInfo"></div>
    </div>
    <script>
        const description = document.getElementById('description');
        
        // Quand on clique, on permet d'éditer
        description.addEventListener('click', () => {
            description.setAttribute('contenteditable', 'true');
            description.focus();
        });
        
        // Quand on appuie sur "Entrée", on arrête l'édition
        description.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault(); // Empêche l'ajout de saut de ligne
                description.setAttribute('contenteditable', 'false'); // Désactive l'édition
                description.blur(); // Perd le focus
                if (description.textContent.trim() === '') {
                    description.textContent = description.getAttribute('data-placeholder'); // Ajouter un placeholder si vide
                }
            }
        });

        // (optionnel) Pour forcer l'affichage ou le masquage du placeholder si besoin
        description.addEventListener('input', () => {
            if (description.textContent.trim() === '') {
                description.textContent = description.getAttribute('data-placeholder'); // Ajouter un placeholder si vide
            }
        });
    </script>         
</body>
</html>
